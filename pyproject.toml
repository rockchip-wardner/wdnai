[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdnai"
version = "0.7.1"
description = "RK 芯片上的 LLM / VLM 访问 SDK（基于 librknn3 的 ctypes 直连）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "pyrk-sdk" }]
dependencies = [
    "numpy>=1.23",
    "transformers>=4.40",
    # 直接使用，不只是 transformers 的传递依赖：gguf_tokenizer.load_tokenizer_from_gguf
    # 要 from tokenizers import Tokenizer / models.BPE / pre_tokenizers.ByteLevel /
    # decoders.ByteLevel，而 backends/_common.load_tokenizer() 对 *.tokenizer.gguf
    # （RKNN 模型自带的 tokenizer 正是这个形态）会走到那条分支 —— 也就是**每次
    # 模型加载**都要它。靠 transformers 传递依赖满足纯属侥幸：换 transformers
    # 版本改了它的 tokenizers 上限、或 --no-deps 安装，都会在模型加载时才炸，
    # 报错点离原因很远。下界取 0.15（上述 API 自该版本起稳定），不设上界，
    # 免得和 transformers 自己的 pin 打架。
    "tokenizers>=0.15",
    "pydantic>=1.10",
    "opencv-python>=4.5",
    "gguf>=0.6",
    # 多卡 VLM 后端（backends/vlm_multicard.py）在**模块级**写死
    # `from jinja2 import Environment`，用它渲染 GGUF tokenizer 自带的 Jinja2
    # chat template（多模态对话的 prompt）。缺包时 worker 侧 LLMSession 初始化
    # 即炸：ModuleNotFoundError: No module named 'jinja2'，算力页表现为
    # 「qwen3.5-vl-9b 启动失败」。只影响多卡 VLM —— 单卡 VLM 走别的后端，
    # 不 import 这条路径。
    # 之前**没有声明**，于是两道防线同时失效：装 SDK 的 --no-deps 装不进 venv，
    # 而依赖审计（scripts/check_sdk_deps.py）只查本文件里声明过的依赖，
    # 看不见它 —— 报错点离原因很远。
    # 下界取 3.1.0（与 transformers 的 chat-template extra 一致），不设上界：
    # Jinja2 的 Environment / from_string API 自 3.1 起稳定。
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
lite = ["opencv-python-headless>=4.5"]
dev = ["pytest>=7", "build>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wdnai*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
wdnai = [
    "models/README.md",
    # cshim（Qwen-Image-2.1 文生图运行时）：**源码随包发布**，.so 由 setup.py 现场编译
    "_cshim/Makefile",
    "_cshim/include/*.h",
    "_cshim/qi/*.h",
    "_cshim/qi/*.cpp",
    "_cshim/libqi_qwen.so",
    # 生成 ziggurat 常量表的脚本（np_zig_tables.h 是它生成的，勿手改）
    "_cshim/tools/*.py",
]
