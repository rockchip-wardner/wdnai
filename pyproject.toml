[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdnai"
version = "0.2.1"
description = "RK 芯片上的 LLM / VLM 访问 SDK（基于 rknn3-toolkit-lite）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "pyrk-sdk" }]
dependencies = [
    "numpy>=1.23",
    "transformers>=4.40",
    "pydantic>=1.10",
    "opencv-python>=4.5",
    "gguf>=0.6",
]

[project.optional-dependencies]
lite = ["opencv-python-headless>=4.5"]
dev = ["pytest>=7", "build>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["wdnai*"]
exclude = ["tests*", "examples*"]

[tool.setuptools.package-data]
wdnai = ["models/README.md"]
